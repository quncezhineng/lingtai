services:
  - type: web
    name: lingtai-api
    runtime: node
    # starter (512 MB) gets OOM-killed before the server binds a port, because
    # the default PGlite store loads an embedded Postgres WASM build.
    plan: standard
    # No corepack: Render preinstalls pnpm at /usr/bin and /usr is read-only, so
    # `corepack enable` dies with EROFS. Render's pnpm honors packageManager.
    buildCommand: pnpm install --frozen-lockfile && pnpm build:server
    startCommand: pnpm start
    healthCheckPath: /api/health
    disk:
      name: lingtai-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # HOST must be 0.0.0.0 on Render, and LingTai only allows that in live mode.
      - key: HOST
        value: 0.0.0.0
      - key: WORKSPACE_MODE
        value: live
      - key: AGENT_BACKEND
        value: model
      - key: MODEL
        value: deepseek/deepseek-flash
      - key: DATA_DIR
        value: /var/data/lingtai
      - key: TASK_WORKER_ENABLED
        value: "true"
      - key: PUBLIC_API_URL
        fromService:
          name: lingtai-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_ORIGINS
        fromService:
          name: lingtai-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # User accounts: with these three set, every user signs up and signs in with
      # their own email and gets a private workspace. Leave them unset to fall back
      # to the single shared LINGTAI_ACCESS_KEY below.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Email verification-code sign-in uses Supabase Auth's email OTP (enable
      # "Email OTP" in Supabase Auth settings; no extra provider key needed).
      # Signed-in sessions expire after this many milliseconds (default 24 hours).
      - key: SESSION_TTL_MS
        value: "86400000"
      # Only used when the Supabase variables above are unset (one owner per deploy).
      - key: LINGTAI_ACCESS_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        sync: false
      # Live Google workspace (Gmail/Calendar): enable the OAuth consent screen and
      # set the redirect URI to PUBLIC_API_URL + /api/google/callback (PUBLIC_API_URL
      # is already the live Render URL above).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: CPK_INTELLIGENCE_API_KEY
        sync: false
      # Use the CLI-issued identity for the same Intelligence project as the key.
      - key: CPK_TELEMETRY_ID
        sync: false
      # Delete these two entries, and the lingtai-browser service below, to
      # deploy without browsing. The API boots either way.
      - key: BROWSER_WORKER_URL
        value: http://lingtai-browser:8790
      - key: WORKER_TOKEN
        fromService:
          name: lingtai-browser
          type: pserv
          envVarKey: WORKER_TOKEN
      # Per-user Linux computer sandbox (optional). Choose E2B Desktop so every
      # user gets their own container; a unique COMPUTER_DEPLOYMENT_ID is required.
      - key: COMPUTER_ENABLED
        value: "false"
      - key: COMPUTER_PROVIDER
        value: e2b-desktop
      - key: E2B_API_KEY
        sync: false
      - key: COMPUTER_DEPLOYMENT_ID
        sync: false

  # Private Chromium for page reads, screenshots, and Take control.
  # Remove this service to skip it. The image listens on 8790, not $PORT.
  - type: pserv
    name: lingtai-browser
    runtime: docker
    plan: standard
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: ./apps/worker
    disk:
      name: lingtai-browser-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: WORKER_TOKEN
        generateValue: true
      - key: WORKER_HOST
        value: 0.0.0.0
      - key: WORKER_DATA_DIR
        value: /data
      # Raise these when many signed-in users need the browser at once; each user
      # gets an isolated Chromium profile.
      - key: WORKER_MAX_SESSIONS
        value: "3"
      - key: WORKER_MAX_PROFILES
        value: "20"

  - type: web
    name: lingtai-web
    runtime: static
    # --clear avoids a cached Metro transform keeping a stale EXPO_PUBLIC_API_URL,
    # which Expo inlines into the bundle at build time.
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --dir apps/mobile exec expo export --platform web --output-dir dist/web --clear
    staticPublishPath: apps/mobile/dist/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        fromService:
          name: lingtai-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
